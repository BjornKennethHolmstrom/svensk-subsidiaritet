<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Background and grid for technical feel -->
  <rect width="800" height="480" fill="#f8fafc" />
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="400" />
    <line x1="250" y1="50" x2="250" y2="400" />
    <line x1="400" y1="50" x2="400" y2="400" />
    <line x1="550" y1="50" x2="550" y2="400" />
    <line x1="700" y1="50" x2="700" y2="400" />
    
    <line x1="80" y1="150" x2="720" y2="150" />
    <line x1="80" y1="275" x2="720" y2="275" />
    <line x1="80" y1="400" x2="720" y2="400" />
  </g>

  <!-- Axes -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="80" y1="400" x2="740" y2="400" marker-end="url(#arrow)" />
    <line x1="80" y1="400" x2="80" y2="60" marker-end="url(#arrow)" />
  </g>

  <!-- Arrowhead for the axes -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Shaded area (Transition Valley) -->
  <path d="M 100 150 Q 400 110, 700 120 C 550 120, 500 380, 400 380 C 300 380, 250 150, 100 150 Z" fill="#f43f5e" opacity="0.1" />

  <!-- The naive transition (Capacity drop) -->
  <path d="M 100 150 C 250 150, 300 380, 400 380 C 500 380, 550 120, 700 120" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="8 6" />

  <!-- The managed transition (Bridge-building institutions) -->
  <path d="M 100 150 Q 400 110, 700 120" fill="none" stroke="#0d9488" stroke-width="4" />

  <!-- Nodes -->
  <circle cx="100" cy="150" r="7" fill="#0f172a" />
  <circle cx="700" cy="120" r="7" fill="#0f172a" />

  <!-- Title -->
  <text x="400" y="35" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
    The Transition Valley: the risk of capacity loss
  </text>

  <!-- Axis labels -->
  <text x="400" y="445" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    Time / degree of decentralization
  </text>
  <text x="-230" y="45" font-family="sans-serif" font-size="14" fill="#475569" transform="rotate(-90)" text-anchor="middle">
    Governance capacity
  </text>

  <!-- Labels in the graph -->
  <text x="115" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">
    Centralized starting point
  </text>
  
  <text x="685" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">
    Polycentric target system
  </text>

  <!-- Line descriptions -->
  <text x="400" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">
    Managed transition (bridge-building institutions)
  </text>
  
  <text x="400" y="350" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e11d48" text-anchor="middle">
    Naive transition (collapsed coordination)
  </text>
  
  <!-- Deepest point marker -->
  <circle cx="400" cy="380" r="5" fill="#e11d48" />
  <text x="400" y="405" font-family="sans-serif" font-size="12" fill="#e11d48" text-anchor="middle">
    Critical vulnerability zone
  </text>
</svg>
