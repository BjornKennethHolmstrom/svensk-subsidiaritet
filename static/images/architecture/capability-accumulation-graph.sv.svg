<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Bakgrund -->
  <rect width="800" height="600" fill="#f8fafc" />
  
  <defs>
    <!-- Pilspetsar för anslutningslinjer -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Rubrik (svensk standardformatering) -->
  <text x="400" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Kapacitetsuppbyggnad: parallell utveckling
  </text>
  <text x="400" y="65" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    Bygga strukturell förmåga före auktoritetsdistribution
  </text>

  <!-- Linjer från start till kolumner -->
  <path d="M 400 150 L 400 180 L 150 180 L 150 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 400 150 L 400 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 400 150 L 400 180 L 650 180 L 650 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Linjer mellan kolumner och sub-noder -->
  <line x1="150" y1="265" x2="150" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="265" x2="400" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="650" y1="265" x2="650" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Linjer från sub-noder till slutmål -->
  <path d="M 150 375 L 150 430 L 380 430 L 380 465" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <path d="M 400 375 L 400 465" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <path d="M 650 375 L 650 430 L 420 430 L 420 465" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />

  <!-- Startnod -->
  <rect x="250" y="100" width="300" height="50" rx="6" fill="#1e293b" />
  <text x="400" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Svenskt parlamentariskt system
  </text>

  <!-- Parallella kolumner (Huvudkapaciteter) -->
  <!-- 1. Politisk pluralisering -->
  <rect x="50" y="215" width="200" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <text x="150" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Politisk pluralisering
  </text>

  <!-- 2. Epistemisk kapacitet -->
  <rect x="300" y="215" width="200" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <text x="400" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Epistemisk kapacitet
  </text>

  <!-- 3. Administrativ koordination -->
  <rect x="550" y="215" width="200" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <text x="650" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Administrativ koordination
  </text>

  <!-- Sub-noder (Konkreta implementeringar) -->
  <!-- 1. Lokal representation -->
  <rect x="50" y="325" width="200" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2" />
  <text x="150" y="355" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    Lokal representation
  </text>

  <!-- 2. Distribuerad datainsamling -->
  <rect x="300" y="325" width="200" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2" />
  <text x="400" y="355" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    Distribuerad datainsamling
  </text>

  <!-- 3. Modulär resursallokering -->
  <rect x="550" y="325" width="200" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2" />
  <text x="650" y="355" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    Modulär resursallokering
  </text>

  <!-- Slutnod (Konvergens) -->
  <rect x="250" y="475" width="300" height="60" rx="6" fill="#0d9488" />
  <text x="400" y="505" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Selektiva subsidiaritetspiloter
  </text>
  <text x="400" y="525" font-family="sans-serif" font-size="12" fill="#ccfbf1" text-anchor="middle">
    Redo för decentralisering av auktoritet
  </text>
</svg>
