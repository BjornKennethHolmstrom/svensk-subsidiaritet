<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background and grid -->
  <rect width="800" height="600" fill="#f8fafc" />
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="550" />
    <line x1="250" y1="50" x2="250" y2="550" />
    <line x1="400" y1="50" x2="400" y2="550" />
    <line x1="550" y1="50" x2="550" y2="550" />
    <line x1="700" y1="50" x2="700" y2="550" />
    <line x1="50" y1="100" x2="750" y2="100" />
    <line x1="50" y1="250" x2="750" y2="250" />
    <line x1="50" y1="400" x2="750" y2="400" />
    <line x1="50" y1="550" x2="750" y2="550" />
  </g>

  <defs>
    <!-- Arrowheads for flows -->
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Main title -->
  <text x="400" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Platform System Architecture
  </text>
  <text x="400" y="75" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    From theoretical evidence to practical policy application
  </text>

  <!-- LAYER 3: Evidence Layer (Bottom) -->
  <rect x="150" y="440" width="500" height="90" rx="6" fill="#1e293b" />
  <text x="400" y="475" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Evidence Layer: Research, Data &amp; Simulation
  </text>
  <text x="400" y="495" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Academic manuscripts, cybernetic analysis, and system models
  </text>
  <!-- Decorative nodes at bottom -->
  <circle cx="170" cy="485" r="4" fill="#38bdf8" />
  <circle cx="190" cy="485" r="4" fill="#38bdf8" />
  <circle cx="610" cy="485" r="4" fill="#38bdf8" />
  <circle cx="630" cy="485" r="4" fill="#38bdf8" />

  <!-- Arrows upward from Evidence to Architecture -->
  <line x1="250" y1="440" x2="250" y2="380" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#flow-arrow)" />
  <line x1="400" y1="440" x2="400" y2="380" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#flow-arrow)" />
  <line x1="550" y1="440" x2="550" y2="380" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#flow-arrow)" />

  <!-- LAYER 2: Architecture Layer (Middle) -->
  <rect x="150" y="290" width="500" height="90" rx="6" fill="#0d9488" />
  <text x="400" y="325" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Architecture Layer: Frameworks &amp; Protocols
  </text>
  <text x="400" y="345" font-family="sans-serif" font-size="13" fill="#ccfbf1" text-anchor="middle">
    The governance spectrum, the transition valley, and institutional design
  </text>
  <!-- Connection points -->
  <rect x="235" y="280" width="30" height="10" fill="#0f766e" />
  <rect x="385" y="280" width="30" height="10" fill="#0f766e" />
  <rect x="535" y="280" width="30" height="10" fill="#0f766e" />

  <!-- Arrows upward from Architecture to Policy Lab -->
  <line x1="250" y1="280" x2="250" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#flow-arrow)" />
  <line x1="400" y1="280" x2="400" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#flow-arrow)" />
  <line x1="550" y1="280" x2="550" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#flow-arrow)" />

  <!-- LAYER 1: Policy Lab (Top) -->
  <!-- Lab 1 -->
  <rect x="150" y="130" width="140" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="150" y="130" width="140" height="30" rx="6" fill="#f1f5f9" />
  <!-- Hide bottom corners of the header background to match border radius -->
  <rect x="150" y="150" width="140" height="10" fill="#f1f5f9" />
  <line x1="150" y1="160" x2="290" y2="160" stroke="#cbd5e1" stroke-width="1" />
  <text x="220" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">
    Policy Lab 1
  </text>
  <text x="220" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Housing &amp;</text>
  <text x="220" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">secure tenure</text>

  <!-- Lab 2 -->
  <rect x="330" y="130" width="140" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="330" y="130" width="140" height="30" rx="6" fill="#f1f5f9" />
  <rect x="330" y="150" width="140" height="10" fill="#f1f5f9" />
  <line x1="330" y1="160" x2="470" y2="160" stroke="#cbd5e1" stroke-width="1" />
  <text x="400" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">
    Policy Lab 2
  </text>
  <text x="400" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Transport &amp;</text>
  <text x="400" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">coordination</text>

  <!-- Lab 3 -->
  <rect x="510" y="130" width="140" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="510" y="130" width="140" height="30" rx="6" fill="#f1f5f9" />
  <rect x="510" y="150" width="140" height="10" fill="#f1f5f9" />
  <line x1="510" y1="160" x2="650" y2="160" stroke="#cbd5e1" stroke-width="1" />
  <text x="580" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">
    Policy Lab 3
  </text>
  <text x="580" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Rural areas &amp;</text>
  <text x="580" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">local governance</text>

  <!-- Side labels -->
  <text x="130" y="490" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end" transform="rotate(-90, 130, 490)">
    Theoretical base
  </text>
  <text x="130" y="340" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="end" transform="rotate(-90, 130, 340)">
    Translation
  </text>
  <text x="130" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end" transform="rotate(-90, 130, 180)">
    Implementation
  </text>
</svg>
